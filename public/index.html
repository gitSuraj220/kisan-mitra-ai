<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1f16" />
  <title>किसान सूत्र AI — Kisan Sutra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-dark: #1b4332;
      --green-mid: #2d6a4f;
      --green-light: #40916c;
      --green-accent: #52b788;
      --green-bright: #74c69d;
      --bg: #0a1611;
      --bg2: #0d1f16;
      --surface: #13241c;
      --surface2: #1a3026;
      --border: rgba(82,183,136,0.16);
      --text: #e9f5ec;
      --text-muted: #7fc196;
      --user-bubble: linear-gradient(135deg, #1b5e20, #2e7d32);
      --bot-bubble: #16291f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(82,183,136,0.10), transparent 60%),
        linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
      color: var(--text);
    }

    /* APP SHELL — phone width on mobile, framed card on desktop */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      max-width: 540px;
      margin: 0 auto;
      position: relative;
      background: rgba(13,31,22,0.4);
    }
    @media (min-width: 600px) {
      body { padding: 22px 0; }
      .app {
        height: calc(100dvh - 44px);
        border: 1px solid var(--border);
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 24px 70px rgba(0,0,0,0.5);
      }
    }

    /* HEADER */
    header {
      flex-shrink: 0;
      background: rgba(19,36,28,0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    .avatar-header {
      width: 46px; height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--green-light), var(--green-accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(82,183,136,0.35);
    }
    .header-info { flex: 1; min-width: 0; }
    .header-info h1 { font-size: 17px; font-weight: 800; letter-spacing: 0.2px; }
    .header-info .status {
      font-size: 12px; color: var(--green-bright);
      display: flex; align-items: center; gap: 5px; margin-top: 2px;
    }
    .status-dot {
      width: 7px; height: 7px; background: #4ade80; border-radius: 50%;
      box-shadow: 0 0 8px #4ade80; animation: statusPulse 2s infinite;
    }
    @keyframes statusPulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .header-badge {
      background: rgba(82,183,136,0.14);
      border: 1px solid rgba(82,183,136,0.3);
      color: var(--green-bright);
      font-size: 11px; font-weight: 700;
      padding: 5px 11px; border-radius: 20px; white-space: nowrap;
    }

    /* QUICK CHIPS */
    .chips-wrap {
      flex-shrink: 0;
      padding: 11px 14px 7px;
      overflow-x: auto;
      display: flex; gap: 8px;
      scrollbar-width: none;
      background: rgba(19,36,28,0.5);
      border-bottom: 1px solid var(--border);
      -webkit-overflow-scrolling: touch;
    }
    .chips-wrap::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--green-bright);
      font-size: 13px; font-weight: 600;
      padding: 8px 14px; border-radius: 22px;
      cursor: pointer; transition: all 0.16s;
      white-space: nowrap; font-family: inherit;
    }
    .chip:hover { background: var(--green-mid); color: #fff; transform: translateY(-1px); }
    .chip:active { transform: scale(0.95); }

    /* CHAT */
    .chat-area {
      flex: 1; overflow-y: auto;
      padding: 18px 14px;
      display: flex; flex-direction: column; gap: 8px;
      scroll-behavior: smooth; overscroll-behavior: contain;
    }
    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(82,183,136,0.25); border-radius: 4px; }

    /* WELCOME */
    .welcome {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 20px; text-align: center; flex: 1; min-height: 0;
    }
    .welcome-avatar {
      width: 88px; height: 88px;
      background: linear-gradient(135deg, var(--green-mid), var(--green-accent));
      border-radius: 28px;
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; margin-bottom: 18px;
      box-shadow: 0 12px 32px rgba(82,183,136,0.3);
      animation: floaty 4s ease-in-out infinite;
    }
    @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    .welcome h2 { font-size: 22px; font-weight: 800; margin-bottom: 9px; }
    .welcome p { font-size: 14.5px; color: var(--text-muted); line-height: 1.7; max-width: 330px; }
    .welcome-tags {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px;
    }
    .welcome-tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--green-bright);
      font-size: 13px; font-weight: 600;
      padding: 8px 14px; border-radius: 14px;
      cursor: pointer; transition: all 0.16s; font-family: inherit;
    }
    .welcome-tag:hover { background: var(--green-mid); color: #fff; transform: translateY(-2px); }
    .welcome-tag:active { transform: scale(0.95); }

    /* MESSAGES */
    .msg-row { display: flex; align-items: flex-end; gap: 8px; animation: msgIn 0.25s ease; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-av {
      width: 32px; height: 32px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0; margin-bottom: 2px;
    }
    .msg-av.bot { background: linear-gradient(135deg, var(--green-light), var(--green-accent)); }
    .msg-av.usr { background: linear-gradient(135deg, #1565c0, #1976d2); }
    .bubble-wrap { display: flex; flex-direction: column; max-width: 80%; }
    .msg-row.user .bubble-wrap { align-items: flex-end; }
    .bubble {
      padding: 11px 15px; border-radius: 18px;
      font-size: 14.8px; line-height: 1.68; word-break: break-word;
    }
    .msg-row.bot .bubble {
      background: var(--bot-bubble); color: var(--text);
      border: 1px solid rgba(82,183,136,0.14);
      border-bottom-left-radius: 5px;
    }
    .msg-row.user .bubble {
      background: var(--user-bubble); color: #f1fff2;
      border-bottom-right-radius: 5px;
    }
    .bubble strong { color: var(--green-bright); }
    .bubble em { color: #ffe082; font-style: normal; }
    .msg-meta { display: flex; align-items: center; gap: 4px; }
    .msg-time { font-size: 10.5px; color: rgba(255,255,255,0.3); margin-top: 3px; padding: 0 4px; }
    .speak-btn {
      background: none; border: none; cursor: pointer;
      font-size: 14px; padding: 3px 6px; color: rgba(255,255,255,0.4);
      transition: color 0.2s; margin-top: 2px;
    }
    .speak-btn:hover { color: var(--green-accent); }

    /* TYPING / STATUS */
    .typing-row { display: flex; align-items: flex-end; gap: 8px; }
    .typing-bubble {
      background: var(--bot-bubble); border: 1px solid rgba(82,183,136,0.14);
      border-bottom-left-radius: 5px; padding: 13px 16px; border-radius: 18px;
      display: flex; gap: 5px; align-items: center;
    }
    .typing-bubble .label { font-size: 12.5px; color: var(--text-muted); margin-left: 2px; }
    .dot {
      width: 7px; height: 7px; background: var(--green-accent); border-radius: 50%;
      animation: typingBounce 1.3s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce { 0%,80%,100%{transform:translateY(0);opacity:0.4} 40%{transform:translateY(-6px);opacity:1} }

    /* INPUT */
    .input-section {
      flex-shrink: 0;
      background: rgba(19,36,28,0.92);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding: 9px 14px 13px;
      padding-bottom: max(13px, env(safe-area-inset-bottom));
    }
    .voice-status {
      font-size: 12px; color: #ef9a9a; text-align: center;
      min-height: 18px; margin-bottom: 6px; transition: color 0.2s;
    }
    .voice-status.active { color: var(--green-accent); }
    .input-row {
      display: flex; align-items: flex-end; gap: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 26px; padding: 6px 6px 6px 16px; transition: all 0.18s;
    }
    .input-row:focus-within {
      border-color: rgba(82,183,136,0.45);
      box-shadow: 0 0 0 3px rgba(82,183,136,0.1);
    }
    textarea {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 15px; resize: none;
      max-height: 110px; min-height: 38px; line-height: 1.5;
      font-family: inherit; padding: 7px 0; scrollbar-width: none;
    }
    textarea::-webkit-scrollbar { display: none; }
    textarea::placeholder { color: rgba(255,255,255,0.32); }
    .input-btns { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .icon-btn {
      width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; transition: all 0.16s; flex-shrink: 0;
    }
    .btn-clear { background: transparent; color: rgba(255,255,255,0.35); font-size: 16px; }
    .btn-clear:hover { color: #ef9a9a; }
    .btn-voice { background: var(--surface); color: var(--green-bright); border: 1px solid var(--border); }
    .btn-voice:hover { background: var(--green-mid); color:#fff; }
    .btn-voice.recording {
      background: #c62828; border-color: #ef5350; color: #fff;
      animation: recPulse 1s infinite;
    }
    @keyframes recPulse { 0%,100%{box-shadow:0 0 0 0 rgba(239,83,80,0.5)} 50%{box-shadow:0 0 0 8px rgba(239,83,80,0)} }
    .btn-send {
      background: linear-gradient(135deg, var(--green-light), var(--green-accent));
      color: #fff; box-shadow: 0 3px 10px rgba(82,183,136,0.4);
    }
    .btn-send:hover { filter: brightness(1.08); }
    .btn-send:active { transform: scale(0.92); }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  </style>
</head>
<body>

<div class="app">
  <header>
    <div class="avatar-header">🌾</div>
    <div class="header-info">
      <h1>किसान सूत्र AI</h1>
      <div class="status">
        <span class="status-dot"></span>
        <span>Online · Real-time खेती सहायक</span>
      </div>
    </div>
    <div class="header-badge">🇮🇳 हिंदी</div>
  </header>

  <div class="chips-wrap" id="chips">
    <button class="chip" onclick="askQuick('आज गेहूं का मंडी भाव क्या है?')">💰 आज का भाव</button>
    <button class="chip" onclick="askQuick('इस हफ्ते मौसम कैसा रहेगा खेती के लिए?')">☀️ मौसम</button>
    <button class="chip" onclick="askQuick('गेहूं में कौन सी खाद डालें?')">🧪 गेहूं खाद</button>
    <button class="chip" onclick="askQuick('धान की फसल में कीट लगे हैं, क्या करें?')">🐛 धान कीट</button>
    <button class="chip" onclick="askQuick('PM-KISAN योजना की ताज़ा जानकारी बताओ')">🏛️ PM-KISAN</button>
    <button class="chip" onclick="askQuick('टमाटर उगाने का सही तरीका बताओ')">🍅 टमाटर</button>
    <button class="chip" onclick="askQuick('मिट्टी परीक्षण कैसे कराएं?')">🌱 मिट्टी</button>
    <button class="chip" onclick="askQuick('ड्रिप सिंचाई के फायदे क्या हैं?')">💧 सिंचाई</button>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <div class="welcome-avatar">👨‍🌾</div>
      <h2>नमस्ते! मैं किसान सूत्र हूँ</h2>
      <p>खेती, खाद, बीज, फसल, मंडी भाव और सरकारी योजनाओं पर कोई भी सवाल पूछें — हिंदी या English में। 🎤 बोलकर भी पूछ सकते हैं।</p>
      <div class="welcome-tags">
        <button class="welcome-tag" onclick="askQuick('इस मौसम में कौन सी फसल बोऊं?')">🌾 फसल</button>
        <button class="welcome-tag" onclick="askQuick('गेहूं के लिए सबसे अच्छी खाद कौन सी है?')">🧪 खाद</button>
        <button class="welcome-tag" onclick="askQuick('कम पानी में सिंचाई कैसे करें?')">💧 सिंचाई</button>
        <button class="welcome-tag" onclick="askQuick('फसल में कीट कैसे रोकें?')">🐛 कीट</button>
        <button class="welcome-tag" onclick="askQuick('किसानों के लिए सरकारी योजनाएं बताओ')">💰 योजनाएं</button>
        <button class="welcome-tag" onclick="document.getElementById('voiceBtn').click()">🎤 Voice</button>
      </div>
    </div>
  </div>

  <div class="input-section">
    <div class="voice-status" id="voiceStatus"></div>
    <div class="input-row">
      <textarea id="userInput" placeholder="सवाल लिखें या 🎤 बोलें..." rows="1"
        onkeydown="handleKey(event)" oninput="resize(this)"></textarea>
      <div class="input-btns">
        <button class="icon-btn btn-clear" onclick="clearChat()" title="Clear">🗑️</button>
        <button class="icon-btn btn-voice" id="voiceBtn" onclick="toggleVoice()" title="Voice">🎤</button>
        <button class="icon-btn btn-send" id="sendBtn" onclick="sendMsg()" title="Send">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
  const sessionId = 'ks_' + Math.random().toString(36).substr(2, 9);
  let isRec = false, recognition = null, isSpeaking = false;

  function resize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 110) + 'px'; }
  function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } }
  function askQuick(q) { const i = document.getElementById('userInput'); i.value = q; resize(i); sendMsg(); }
  function now() { return new Date().toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' }); }

  function escHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function esc(t){return t.replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  function fmt(t){
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/^#{1,3} (.+)$/gm,'<strong>$1</strong>')
      .replace(/^[-•] (.+)$/gm,'• $1')
      .replace(/\n/g,'<br/>');
  }

  function appendMsg(role, text) {
    document.getElementById('welcome')?.remove();
    const area = document.getElementById('chatArea');
    const row = document.createElement('div');
    row.className = 'msg-row ' + role;
    if (role === 'bot') {
      row.innerHTML = `
        <div class="msg-av bot">🌾</div>
        <div class="bubble-wrap">
          <div class="bubble">${fmt(text)}</div>
          <div class="msg-meta">
            <span class="msg-time">${now()}</span>
            <button class="speak-btn" onclick="speak(this)" data-text="${esc(text)}">🔊</button>
          </div>
        </div>`;
    } else {
      row.innerHTML = `
        <div class="bubble-wrap">
          <div class="bubble">${escHtml(text)}</div>
          <span class="msg-time" style="text-align:right">${now()}</span>
        </div>
        <div class="msg-av usr">👤</div>`;
    }
    area.appendChild(row);
    area.scrollTop = area.scrollHeight;
  }

  async function sendMsg() {
    const inp = document.getElementById('userInput');
    const msg = inp.value.trim();
    if (!msg) return;
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    inp.value = ''; inp.style.height = 'auto';
    appendMsg('user', msg);

    const area = document.getElementById('chatArea');
    const typing = document.createElement('div');
    typing.className = 'typing-row'; typing.id = 'typing';
    typing.innerHTML = `<div class="msg-av bot">🌾</div>
      <div class="typing-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="label" id="typingLabel"></span></div>`;
    area.appendChild(typing);
    area.scrollTop = area.scrollHeight;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg, sessionId }),
      });

      if (!res.ok) {
        document.getElementById('typing')?.remove();
        const err = await res.json().catch(() => ({}));
        appendMsg('bot', '❌ ' + (err.error || 'कुछ गलत हो गया।'));
        btn.disabled = false; return;
      }

      let bubble = null, spBtn = null, full = '';
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';

      function ensureBubble() {
        if (bubble) return;
        document.getElementById('typing')?.remove();
        document.getElementById('welcome')?.remove();
        const row = document.createElement('div');
        row.className = 'msg-row bot';
        const bid = 'b' + Date.now();
        row.innerHTML = `
          <div class="msg-av bot">🌾</div>
          <div class="bubble-wrap">
            <div class="bubble" id="${bid}"></div>
            <div class="msg-meta">
              <span class="msg-time">${now()}</span>
              <button class="speak-btn" id="sp_${bid}" onclick="speak(this)" data-text="">🔊</button>
            </div>
          </div>`;
        area.appendChild(row);
        bubble = document.getElementById(bid);
        spBtn = document.getElementById('sp_' + bid);
      }

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split('\n');
        buf = parts.pop();
        for (const line of parts) {
          if (!line.startsWith('data: ')) continue;
          try {
            const d = JSON.parse(line.slice(6));
            if (d.type === 'status') {
              const lbl = document.getElementById('typingLabel');
              if (lbl) lbl.textContent = d.content;
            } else if (d.type === 'text') {
              ensureBubble();
              full += d.content;
              bubble.innerHTML = fmt(full);
              area.scrollTop = area.scrollHeight;
            } else if (d.type === 'done') {
              if (spBtn) spBtn.dataset.text = full;
            } else if (d.type === 'error') {
              ensureBubble();
              bubble.innerHTML = '❌ ' + d.content;
            }
          } catch {}
        }
      }
      document.getElementById('typing')?.remove();
    } catch {
      document.getElementById('typing')?.remove();
      appendMsg('bot', '❌ Connection error. Internet check करें।');
    }
    btn.disabled = false;
    inp.focus();
  }

  // TTS
  function speak(btn) {
    const text = btn.dataset.text;
    if (!text) return;
    if (isSpeaking) { speechSynthesis.cancel(); isSpeaking = false; btn.textContent = '🔊'; return; }
    document.querySelectorAll('.speak-btn').forEach(b => b.textContent = '🔊');
    const u = new SpeechSynthesisUtterance(text);
    u.lang = /[ऀ-ॿ]/.test(text) ? 'hi-IN' : 'en-IN';
    u.rate = 0.92;
    const hv = speechSynthesis.getVoices().find(v => v.lang.startsWith('hi'));
    if (hv && u.lang === 'hi-IN') u.voice = hv;
    u.onstart = () => { isSpeaking = true; btn.textContent = '⏹️'; };
    u.onend = u.onerror = () => { isSpeaking = false; btn.textContent = '🔊'; };
    speechSynthesis.speak(u);
  }

  // Voice input
  function toggleVoice() {
    if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
      setStatus('❌ Browser voice support नहीं। Chrome use करें।', false); return;
    }
    isRec ? stopVoice() : startVoice();
  }
  function startVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.continuous = false; recognition.interimResults = true; recognition.lang = 'hi-IN';
    recognition.onstart = () => {
      isRec = true;
      const b = document.getElementById('voiceBtn');
      b.classList.add('recording'); b.textContent = '🔴';
      setStatus('🎤 बोलिए...', true);
    };
    recognition.onresult = (e) => {
      let final = '', interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++)
        e.results[i].isFinal ? (final += e.results[i][0].transcript) : (interim += e.results[i][0].transcript);
      const inp = document.getElementById('userInput');
      inp.value = final || interim; resize(inp);
    };
    recognition.onend = () => {
      isRec = false;
      const b = document.getElementById('voiceBtn');
      b.classList.remove('recording'); b.textContent = '🎤';
      setStatus('', false);
      if (document.getElementById('userInput').value.trim()) setTimeout(sendMsg, 300);
    };
    recognition.onerror = (e) => {
      isRec = false;
      const b = document.getElementById('voiceBtn');
      b.classList.remove('recording'); b.textContent = '🎤';
      const m = { 'no-speech': '⚠️ कुछ सुनाई नहीं दिया।', 'not-allowed': '❌ Mic permission दें।' };
      setStatus(m[e.error] || '❌ Voice error.', false);
      setTimeout(() => setStatus('', false), 3000);
    };
    recognition.start();
  }
  function stopVoice() { recognition?.stop(); }
  function setStatus(msg, active) {
    const el = document.getElementById('voiceStatus');
    el.textContent = msg; el.className = 'voice-status' + (active ? ' active' : '');
  }

  async function clearChat() {
    if (!confirm('Chat clear करें?')) return;
    await fetch('/api/clear', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId }) });
    location.reload();
  }

  speechSynthesis?.getVoices();
  speechSynthesis?.addEventListener('voiceschanged', () => speechSynthesis.getVoices());
  document.getElementById('userInput').focus();
</script>
</body>
</html>
