<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>किसान मित्र AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-900: #0a1f0f;
      --green-800: #122318;
      --green-700: #1a3322;
      --green-600: #1f4d2e;
      --green-500: #2d6a4f;
      --green-400: #40916c;
      --green-300: #52b788;
      --green-200: #74c69d;
      --green-100: #b7e4c7;
      --green-50:  #d8f3dc;
      --accent:    #52b788;
      --bg:        #0d1f16;
      --surface:   #13261a;
      --surface2:  #1a3326;
      --border:    rgba(82,183,136,0.15);
      --text:      #eaf6ec;
      --text-muted:#81c784;
      --radius:    20px;
      --shadow:    0 4px 24px rgba(0,0,0,0.4);
    }

    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%; height: 100dvh;
      overflow: hidden;
      font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ── SHELL ── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%; height: 100dvh;
      max-width: 500px;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
    }

    /* ── HEADER ── */
    header {
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--green-700), var(--green-800));
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      z-index: 10;
    }

    .logo-wrap {
      width: 46px; height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--green-400), var(--green-300));
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      box-shadow: 0 3px 10px rgba(82,183,136,0.35);
      flex-shrink: 0;
    }

    .header-text { flex: 1; min-width: 0; }
    .header-text h1 {
      font-size: 16px; font-weight: 700;
      background: linear-gradient(90deg, #e8f5e9, #a5d6a7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-text .sub {
      font-size: 11.5px; color: var(--text-muted);
      display: flex; align-items: center; gap: 5px;
      margin-top: 2px;
    }
    .dot {
      width: 6px; height: 6px;
      background: #4caf50; border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .badge {
      background: rgba(82,183,136,0.18);
      border: 1px solid rgba(82,183,136,0.3);
      color: var(--green-200);
      font-size: 11px; font-weight: 600;
      padding: 5px 11px; border-radius: 20px;
    }

    /* ── QUICK CHIPS ── */
    .chips {
      flex-shrink: 0;
      display: flex; gap: 8px;
      padding: 10px 14px;
      overflow-x: auto;
      scrollbar-width: none;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      flex-shrink: 0;
      background: var(--surface2);
      border: 1px solid rgba(82,183,136,0.2);
      color: var(--green-200);
      font-size: 12.5px; font-weight: 500;
      padding: 7px 14px; border-radius: 20px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      font-family: inherit;
      white-space: nowrap;
    }
    .chip:hover { background: rgba(64,145,108,0.25); }
    .chip:active { background: var(--green-400); color: #fff; transform: scale(0.95); }

    /* ── CHAT AREA ── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
    }
    .chat-area::-webkit-scrollbar { width: 3px; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(82,183,136,0.2); border-radius: 4px; }

    /* ── WELCOME ── */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 16px;
      text-align: center;
      flex: 1;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    .welcome-icon {
      width: 88px; height: 88px;
      background: linear-gradient(135deg, var(--green-500), var(--green-300));
      border-radius: 28px;
      display: flex; align-items: center; justify-content: center;
      font-size: 44px;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(82,183,136,0.3);
    }

    .welcome h2 {
      font-size: 22px; font-weight: 700;
      color: var(--text); margin-bottom: 10px;
    }
    .welcome p {
      font-size: 13.5px; color: var(--text-muted);
      line-height: 1.75; max-width: 300px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      margin-top: 20px;
    }

    .quick-btn {
      background: var(--surface2);
      border: 1px solid rgba(82,183,136,0.2);
      color: var(--text);
      font-size: 13px; font-weight: 500;
      padding: 12px 14px;
      border-radius: 14px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      display: flex; align-items: center; gap: 8px;
      transition: background 0.15s, transform 0.1s, border-color 0.15s;
      line-height: 1.4;
    }
    .quick-btn:hover { background: rgba(64,145,108,0.2); border-color: rgba(82,183,136,0.4); }
    .quick-btn:active { transform: scale(0.97); background: var(--green-500); border-color: var(--green-300); }
    .quick-btn .qicon { font-size: 20px; flex-shrink: 0; }

    /* ── MESSAGES ── */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      animation: msgIn 0.2s ease;
    }
    @keyframes msgIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
    .msg-row.user { flex-direction: row-reverse; }

    .av {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
      margin-bottom: 18px;
    }
    .av.bot { background: linear-gradient(135deg, var(--green-400), var(--green-300)); }
    .av.usr { background: linear-gradient(135deg, #1565c0, #42a5f5); }

    .bwrap { display: flex; flex-direction: column; max-width: 80%; }
    .msg-row.user .bwrap { align-items: flex-end; }

    .bubble {
      padding: 11px 15px;
      border-radius: 20px;
      font-size: 14.5px;
      line-height: 1.7;
      word-break: break-word;
    }
    .msg-row.bot .bubble {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid rgba(82,183,136,0.12);
      border-bottom-left-radius: 5px;
    }
    .msg-row.user .bubble {
      background: linear-gradient(135deg, var(--green-500), var(--green-400));
      color: #f0fff3;
      border-bottom-right-radius: 5px;
      box-shadow: 0 3px 10px rgba(40,167,69,0.2);
    }
    .bubble strong { color: #a5d6a7; }

    .meta {
      display: flex; align-items: center; gap: 6px;
      margin-top: 4px; padding: 0 4px;
    }
    .msg-time { font-size: 10.5px; color: rgba(255,255,255,0.28); }
    .speak-btn {
      background: none; border: none; cursor: pointer;
      font-size: 13px; padding: 2px 5px;
      color: rgba(255,255,255,0.3);
      transition: color 0.15s;
    }
    .speak-btn:active, .speak-btn.playing { color: var(--green-300); }

    /* Typing */
    .typing-row { display: flex; align-items: flex-end; gap: 8px; }
    .typing-bubble {
      background: var(--surface2);
      border: 1px solid rgba(82,183,136,0.12);
      border-radius: 20px; border-bottom-left-radius: 5px;
      padding: 13px 18px;
      display: flex; gap: 5px; align-items: center;
    }
    .typing-bubble span {
      width: 7px; height: 7px;
      background: var(--green-300); border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:0.35} 40%{transform:translateY(-7px);opacity:1} }

    /* ── INPUT ── */
    .input-section {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }

    .voice-bar {
      min-height: 20px;
      font-size: 12px;
      color: #ef9a9a;
      text-align: center;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    .voice-bar.on { color: var(--green-300); }

    .input-wrap {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 28px;
      padding: 7px 7px 7px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrap:focus-within {
      border-color: rgba(82,183,136,0.5);
      box-shadow: 0 0 0 3px rgba(82,183,136,0.1);
    }

    textarea {
      flex: 1;
      background: transparent; border: none; outline: none;
      color: var(--text);
      font-size: 15px; resize: none;
      max-height: 110px; min-height: 36px;
      line-height: 1.55;
      font-family: inherit;
      padding: 5px 0;
      scrollbar-width: none;
    }
    textarea::-webkit-scrollbar { display: none; }
    textarea::placeholder { color: rgba(255,255,255,0.28); }

    .btns { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }

    .ibtn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      transition: all 0.18s;
      flex-shrink: 0;
    }
    .ibtn-clear {
      background: transparent;
      color: rgba(255,255,255,0.3);
    }
    .ibtn-clear:active { color: #ef9a9a; background: rgba(239,154,154,0.1); }

    .ibtn-voice {
      background: var(--surface);
      color: var(--green-200);
      border: 1px solid rgba(82,183,136,0.25);
    }
    .ibtn-voice:active { background: var(--green-400); color: #fff; }
    .ibtn-voice.rec {
      background: #c62828;
      border-color: #ef5350;
      color: #fff;
      animation: recPulse 1s infinite;
    }
    @keyframes recPulse { 0%,100%{box-shadow:0 0 0 0 rgba(239,83,80,0.5)} 60%{box-shadow:0 0 0 8px rgba(239,83,80,0)} }

    .ibtn-send {
      background: linear-gradient(135deg, var(--green-400), var(--green-300));
      color: #fff;
      box-shadow: 0 3px 10px rgba(82,183,136,0.4);
    }
    .ibtn-send:active { transform: scale(0.92); }
    .ibtn-send:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="logo-wrap">🌾</div>
    <div class="header-text">
      <h1>किसान मित्र AI</h1>
      <div class="sub">
        <span class="dot"></span>
        <span>Online · खेती का AI साथी</span>
      </div>
    </div>
    <div class="badge">🇮🇳 हिंदी</div>
  </header>

  <!-- Chips -->
  <div class="chips">
    <button class="chip" onclick="askQuick('गेहूं में कौन सी खाद डालें?')">🌾 गेहूं खाद</button>
    <button class="chip" onclick="askQuick('धान की फसल में कीट लगे हैं, क्या करें?')">🐛 धान कीट</button>
    <button class="chip" onclick="askQuick('PM-KISAN योजना के बारे में बताओ')">💰 PM-KISAN</button>
    <button class="chip" onclick="askQuick('टमाटर उगाने का सही तरीका बताओ')">🍅 टमाटर</button>
    <button class="chip" onclick="askQuick('मिट्टी परीक्षण कैसे कराएं?')">🌱 मिट्टी</button>
    <button class="chip" onclick="askQuick('ड्रिप सिंचाई के फायदे क्या हैं?')">💧 सिंचाई</button>
    <button class="chip" onclick="askQuick('गन्ने की खेती कैसे करें?')">🎋 गन्ना</button>
    <button class="chip" onclick="askQuick('फसल बीमा योजना कैसे लें?')">🛡️ बीमा</button>
  </div>

  <!-- Chat -->
  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">👨‍🌾</div>
      <h2>नमस्ते! मैं किसान मित्र हूँ</h2>
      <p>खेती, खाद, बीज, फसल, और सरकारी योजनाओं पर कोई भी सवाल पूछें — हिंदी या English में।</p>

      <div class="quick-grid">
        <button class="quick-btn" onclick="askQuick('गेहूं की खेती के बारे में बताओ')">
          <span class="qicon">🌾</span><span>फसल की जानकारी</span>
        </button>
        <button class="quick-btn" onclick="askQuick('फसल के लिए कौन सी खाद सबसे अच्छी है?')">
          <span class="qicon">🧪</span><span>खाद व उर्वरक</span>
        </button>
        <button class="quick-btn" onclick="askQuick('ड्रिप सिंचाई कैसे करें?')">
          <span class="qicon">💧</span><span>सिंचाई तकनीक</span>
        </button>
        <button class="quick-btn" onclick="askQuick('फसल में कीट और बीमारी का इलाज बताओ')">
          <span class="qicon">🐛</span><span>कीट व बीमारी</span>
        </button>
        <button class="quick-btn" onclick="askQuick('PM-KISAN और सरकारी योजनाएं बताओ')">
          <span class="qicon">💰</span><span>सरकारी योजनाएं</span>
        </button>
        <button class="quick-btn" onclick="toggleVoice()">
          <span class="qicon">🎤</span><span>Voice में बात करें</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-section">
    <div class="voice-bar" id="voiceBar"></div>
    <div class="input-wrap">
      <textarea
        id="userInput"
        placeholder="सवाल लिखें या 🎤 बोलें..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="resize(this)"
      ></textarea>
      <div class="btns">
        <button class="ibtn ibtn-clear" onclick="clearChat()" title="Clear">🗑️</button>
        <button class="ibtn ibtn-voice" id="voiceBtn" onclick="toggleVoice()">🎤</button>
        <button class="ibtn ibtn-send" id="sendBtn" onclick="sendMsg()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>

</div>

<script>
  const sessionId = 'ks_' + Math.random().toString(36).substr(2,9);
  let isRec = false, recognition = null, isSpeaking = false;

  function resize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 110) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 480) {
      e.preventDefault(); sendMsg();
    }
  }

  function askQuick(q) {
    const inp = document.getElementById('userInput');
    inp.value = q; resize(inp);
    sendMsg();
  }

  function now() {
    return new Date().toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' });
  }

  function escHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function esc(t)     { return t.replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  function fmt(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/^#{1,3} (.+)$/gm,'<strong>$1</strong>')
      .replace(/^- (.+)$/gm,'• $1')
      .replace(/\n/g,'<br/>');
  }

  async function sendMsg() {
    const inp = document.getElementById('userInput');
    const msg = inp.value.trim();
    if (!msg) return;

    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    inp.value = ''; inp.style.height = 'auto';

    // User bubble
    document.getElementById('welcome')?.remove();
    const area = document.getElementById('chatArea');
    const uRow = document.createElement('div');
    uRow.className = 'msg-row user';
    uRow.innerHTML = `
      <div class="bwrap">
        <div class="bubble">${escHtml(msg)}</div>
        <div class="meta" style="justify-content:flex-end">
          <span class="msg-time">${now()}</span>
        </div>
      </div>
      <div class="av usr">👤</div>`;
    area.appendChild(uRow);

    // Typing indicator
    const typing = document.createElement('div');
    typing.className = 'typing-row'; typing.id = 'typing';
    typing.innerHTML = `
      <div class="av bot">🌾</div>
      <div class="typing-bubble"><span></span><span></span><span></span></div>`;
    area.appendChild(typing);
    area.scrollTop = area.scrollHeight;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ message: msg, sessionId }),
      });

      document.getElementById('typing')?.remove();

      if (!res.ok) {
        const err = await res.json();
        addBotMsg('❌ ' + (err.error || 'कुछ गलत हो गया।'));
        btn.disabled = false; return;
      }

      const bid = 'b' + Date.now();
      const bRow = document.createElement('div');
      bRow.className = 'msg-row bot';
      bRow.innerHTML = `
        <div class="av bot">🌾</div>
        <div class="bwrap">
          <div class="bubble" id="${bid}"></div>
          <div class="meta">
            <span class="msg-time">${now()}</span>
            <button class="speak-btn" id="sp_${bid}" onclick="speak(this)" data-text="">🔊</button>
          </div>
        </div>`;
      area.appendChild(bRow);

      const bubble = document.getElementById(bid);
      const spBtn  = document.getElementById('sp_' + bid);
      let full = '';

      const reader = res.body.getReader();
      const dec = new TextDecoder();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        for (const line of dec.decode(value).split('\n')) {
          if (!line.startsWith('data: ')) continue;
          try {
            const d = JSON.parse(line.slice(6));
            if (d.type === 'text')  { full += d.content; bubble.innerHTML = fmt(full); area.scrollTop = area.scrollHeight; }
            else if (d.type === 'done')  { spBtn.dataset.text = full; }
            else if (d.type === 'error') { bubble.innerHTML = '❌ ' + d.content; }
          } catch {}
        }
      }

    } catch {
      document.getElementById('typing')?.remove();
      addBotMsg('❌ Connection error. Internet check करें।');
    }

    btn.disabled = false;
    inp.focus();
  }

  function addBotMsg(text) {
    const area = document.getElementById('chatArea');
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `
      <div class="av bot">🌾</div>
      <div class="bwrap">
        <div class="bubble">${escHtml(text)}</div>
        <div class="meta"><span class="msg-time">${now()}</span></div>
      </div>`;
    area.appendChild(row);
    area.scrollTop = area.scrollHeight;
  }

  // TTS
  function speak(btn) {
    const text = btn.dataset.text;
    if (!text) return;
    if (isSpeaking) {
      speechSynthesis.cancel(); isSpeaking = false;
      document.querySelectorAll('.speak-btn').forEach(b => { b.textContent='🔊'; b.classList.remove('playing'); });
      return;
    }
    document.querySelectorAll('.speak-btn').forEach(b => { b.textContent='🔊'; b.classList.remove('playing'); });
    const u = new SpeechSynthesisUtterance(text);
    u.lang = /[\u0900-\u097F]/.test(text) ? 'hi-IN' : 'en-IN';
    u.rate = 0.9;
    const hv = speechSynthesis.getVoices().find(v => v.lang.startsWith('hi'));
    if (hv && u.lang === 'hi-IN') u.voice = hv;
    u.onstart = () => { isSpeaking = true; btn.textContent = '⏹️'; btn.classList.add('playing'); };
    u.onend = u.onerror = () => { isSpeaking = false; btn.textContent = '🔊'; btn.classList.remove('playing'); };
    speechSynthesis.speak(u);
  }

  // Voice Input
  function toggleVoice() {
    if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
      setBar('❌ Chrome browser में voice feature काम करता है।', false); return;
    }
    isRec ? stopVoice() : startVoice();
  }

  function startVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = 'hi-IN';

    recognition.onstart = () => {
      isRec = true;
      document.getElementById('voiceBtn').classList.add('rec');
      document.getElementById('voiceBtn').textContent = '🔴';
      setBar('🎤 बोलिए... (मैं सुन रहा हूँ)', true);
    };

    recognition.onresult = (e) => {
      let final = '', interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        e.results[i].isFinal ? (final += e.results[i][0].transcript) : (interim += e.results[i][0].transcript);
      }
      const inp = document.getElementById('userInput');
      inp.value = final || interim; resize(inp);
    };

    recognition.onend = () => {
      isRec = false;
      const vb = document.getElementById('voiceBtn');
      vb.classList.remove('rec'); vb.textContent = '🎤';
      setBar('', false);
      if (document.getElementById('userInput').value.trim()) setTimeout(sendMsg, 300);
    };

    recognition.onerror = (e) => {
      isRec = false;
      const vb = document.getElementById('voiceBtn');
      vb.classList.remove('rec'); vb.textContent = '🎤';
      const msgs = { 'no-speech':'⚠️ कुछ सुनाई नहीं दिया।', 'not-allowed':'❌ Mic की permission दें।' };
      setBar(msgs[e.error] || '❌ Voice error.', false);
      setTimeout(() => setBar('', false), 3000);
    };

    recognition.start();
  }

  function stopVoice() { recognition?.stop(); }

  function setBar(msg, on) {
    const el = document.getElementById('voiceBar');
    el.textContent = msg;
    el.className = 'voice-bar' + (on ? ' on' : '');
  }

  async function clearChat() {
    if (!confirm('पूरी बातचीत हटाएं?')) return;
    await fetch('/api/clear', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ sessionId })
    });
    document.getElementById('chatArea').innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-icon">👨‍🌾</div>
        <h2>नमस्ते! मैं किसान मित्र हूँ</h2>
        <p>खेती, खाद, बीज, फसल, और सरकारी योजनाओं पर कोई भी सवाल पूछें — हिंदी या English में।</p>
        <div class="quick-grid">
          <button class="quick-btn" onclick="askQuick('गेहूं की खेती के बारे में बताओ')">
            <span class="qicon">🌾</span><span>फसल की जानकारी</span>
          </button>
          <button class="quick-btn" onclick="askQuick('फसल के लिए कौन सी खाद सबसे अच्छी है?')">
            <span class="qicon">🧪</span><span>खाद व उर्वरक</span>
          </button>
          <button class="quick-btn" onclick="askQuick('ड्रिप सिंचाई कैसे करें?')">
            <span class="qicon">💧</span><span>सिंचाई तकनीक</span>
          </button>
          <button class="quick-btn" onclick="askQuick('फसल में कीट और बीमारी का इलाज बताओ')">
            <span class="qicon">🐛</span><span>कीट व बीमारी</span>
          </button>
          <button class="quick-btn" onclick="askQuick('PM-KISAN और सरकारी योजनाएं बताओ')">
            <span class="qicon">💰</span><span>सरकारी योजनाएं</span>
          </button>
          <button class="quick-btn" onclick="toggleVoice()">
            <span class="qicon">🎤</span><span>Voice में बात करें</span>
          </button>
        </div>
      </div>`;
  }

  speechSynthesis?.getVoices();
  speechSynthesis?.addEventListener('voiceschanged', () => speechSynthesis.getVoices());
  document.getElementById('userInput').focus();
</script>
</body>
</html>
